<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Healthcheck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#111}

      .ok{display:inline-block;padding:6px 10px;border-radius:8px;background:#e6ffed;color:#037a48;border:1px solid #b9eccb;font-weight:600}
      .meta{margin-top:8px;color:#666;font-size:12px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ok">ok</div>
      <div class="meta">recipe_frontend static health page</div>
    </div>
  </body>
