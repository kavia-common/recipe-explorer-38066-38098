<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Healthcheck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- PUBLIC_INTERFACE: Static healthcheck marker -->
    <meta name="x-healthcheck" content="ok" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fff;color:#111}
      .wrap{max-width:620px;margin:20px auto;padding:16px}
      .ok{display:inline-block;background:#10b981;color:#fff;padding:6px 10px;border-radius:8px;font-weight:600}
      .muted{color:#6b7280;font-size:12px;margin-top:8px}
      code{background:#f3f4f6;padding:2px 6px;border-radius:6px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ok" aria-label="health">ok</div>
      <div class="muted">
        Static healthcheck page served by the container.<br/>
        Probes should look for <code>&lt;meta name="x-healthcheck" content="ok"&gt;</code>.
      </div>
    </div>
  </body>
</html>
