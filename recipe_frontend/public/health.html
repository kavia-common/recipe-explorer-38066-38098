<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- PUBLIC_INTERFACE -->
    <!-- Static healthcheck page to be served without React -->
    <meta charset="utf-8" />
    <meta name="x-healthcheck" content="ok" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health</title>
    <style>

      .card { border:1px solid #e5e7eb; border-radius:12px; padding:16px 20px; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
      .ok { color:#16a34a; font-weight:600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <span class="ok">ok</span>

    </div>
