<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Health</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Static health marker; matches what healthcheck script looks for -->
    <meta name="x-healthcheck" content="ok" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 32px; color: #111827; }
      .ok { display: inline-block; padding: 8px 12px; border-radius: 8px; background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
    </style>
  </head>
  <body>
    <div class="ok" role="status" aria-live="polite">ok</div>
  </body>
</html>
