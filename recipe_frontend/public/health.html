<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Health</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- PUBLIC_INTERFACE -->
    <!-- Health meta used by healthcheck script to verify readiness without booting React -->
    <meta name="x-healthcheck" content="ok" />
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#fff; color:#111; }
      .wrap { max-width: 640px; margin: 10vh auto; padding: 24px; }
      .ok { display: inline-block; padding: 6px 10px; background: #e6ffed; border: 1px solid #b7eb8f; border-radius: 6px; color: #135200; font-weight: 600; }
      .meta { color:#555; font-size: 12px; margin-top: 12px; }
      a { color:#2563EB; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ok">ok</div>
      <div class="meta">This is a lightweight healthcheck page for static serve. Go to <a href="/">/</a>.</div>
    </div>
  </body>
</html>
