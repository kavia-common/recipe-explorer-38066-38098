<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Health</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- PUBLIC_INTERFACE -->
  <!-- Health meta used by CI healthcheck script to validate readiness without booting React -->
  <meta name="x-healthcheck" content="ok" />
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      background: #f9fafb; color: #111827; }
    .wrap { display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px 28px;
      box-shadow: 0 6px 20px rgba(0,0,0,.06); }
    .ok { color: #10b981; font-weight: 600; }
    .small { color: #6b7280; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="status" aria-live="polite">
      <div>Frontend health: <span class="ok">OK</span></div>
      <div class="small">Static endpoint for CI readiness checks.</div>
    </div>
  </div>
</body>
</html>
